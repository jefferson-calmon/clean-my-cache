name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - run: make build
      - run: ./bin/clean-my-cache scan --verbose
      - run: ./bin/clean-my-cache list
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
